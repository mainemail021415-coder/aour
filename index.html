<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOUR TRADING, INC.</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #F4F4F4;
      color: #222;
    }
    header {
      background-color: #002366; /* deep blue */
      color: #D4AF37; /* gold */
      padding: 20px;
      text-align: center;
    }
    header img {
      width: 120px;
      border-radius: 8px;
      display: block;
      margin: 0 auto 10px;
    }
    h1 {
      margin: 0;
    }
    nav {
      margin-top: 10px;
    }
    nav a {
      color: #D4AF37;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    section {
      padding: 40px;
      text-align: center;
    }
    .btn {
      background-color: #D4AF37;
      color: #002366;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    footer {
      background-color: #002366;
      color: #D4AF37;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>
    <!-- Logo file placed in /assets/logo.png -->
    <img src="assets/logo.png" alt="AOUR TRADING, INC Logo">
    <h1>AOUR TRADING, INC.</h1>
    <p>Empowering Global Trade Solutions</p>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section>
    <h2>Welcome to Our Company</h2>
    <p>We provide reliable trading and logistics services worldwide.</p>
    <button class="btn">Learn More</button>
  </section>

  <footer>
    <p>&copy; 2026 AOUR TRADING, INC. All rights reserved.</p>
  </footer>
</body>
</html>
